name: Create Signing Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Create keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore xiaoxi-release.jks \
            -alias xiaoxi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Xiaoxi2026Key \
            -keypass Xiaoxi2026Key \
            -dname "CN=Xiaoxi, OU=Alliance, O=Alliance, L=Perm, C=RU"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxi-signing-key
          path: xiaoxi-release.jks
